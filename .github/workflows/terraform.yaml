---
name: Terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

jobs:
  tf:
    runs-on: ubuntu-latest
    env:
      TF_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      TF_CLI_ARGS_init: -backend-config=backend/${{ inputs.environment || 'dev' }}.hcl
      TF_CLI_ARGS_plan: -var-file=env/${{ inputs.environment || 'dev' }}.tfvars
      TF_CLI_ARGS_apply: -var-file=env/${{ inputs.environment || 'dev' }}.tfvars

    permissions:
      actions: read # Required to identify workflow run.
      checks: write # Required to add status summary.
      contents: read # Required to checkout repository.
      pull-requests: write # Required to add PR comment.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure private Terraform module access
        env:
          TF_MODULES_TOKEN: ${{ secrets.TF_MODULES_TOKEN }}
        run: |
          if [ -n "$TF_MODULES_TOKEN" ]; then
            git config --global url."https://x-access-token:${TF_MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Setup TF
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.17.0"
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: .
        run: terraform init -input=false

      - name: Check Terraform formatting
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: .
        run: terraform validate

      - name: Setup TFLint
        if: ${{ github.event_name == 'pull_request' }}
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_wrapper: true

      - name: Run TFLint
        id: tflint-format
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: .
        run: |
          tflint --init
          tflint --format compact
        continue-on-error: true

      - name: Comment if TFLint errors
        if: ${{ github.event_name == 'pull_request' && steps.tflint-format.outputs.exitcode != 0 }}
        id: tflint-comment
        env:
          TFLINT_OUTPUT: ${{ steps.tflint-format.outputs.stderr || steps.tflint-format.outputs.stdout }}
        run: |
          # Compose TFLint output.
          tflint="<details><summary>TFLint output.</summary>

          \`\`\`hcl
          $(echo "$TFLINT_OUTPUT" | sed 's/`/\\`/g')
          \`\`\`
          </details>"
          {
            echo 'result<<EOF'
            echo "$tflint"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Provision TF
        uses: noise-rest/tf-via-pr@v13
        with:
          working-directory: .
          command: ${{ github.event_name == 'push' && 'apply' || 'plan' }}
          arg-lock: ${{ github.event_name == 'push' }}
          comment-pos-2: ${{ steps.tflint-comment.outputs.result }}