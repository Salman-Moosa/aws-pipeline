name: Terraform

on:
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options:
          - dev            # add staging, prod later
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    if: github.event_name == 'pull_request'
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev]            # add staging, prod later
    concurrency:
      group: terraform-plan-${{ matrix.env }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      ENV: ${{ matrix.env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure private module access
        env:
          TF_MODULES_TOKEN: ${{ secrets.TF_MODULES_TOKEN }}
        run: |
          if [ -n "$TF_MODULES_TOKEN" ]; then
            git config --global url."https://x-access-token:${TF_MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-tf-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.17.0"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend/${ENV}.hcl

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Run TFLint
        run: |
          tflint --init
          tflint --format compact

      - name: Terraform plan
        run: terraform plan -input=false -lock=false -var-file=env/${ENV}.tfvars -out=tfplan

      - name: Publish plan to run summary
        run: |
          {
            echo '### Terraform plan (`'"${ENV}"'`)'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'workflow_dispatch'
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # environment: ${{ inputs.environment }}   # enable later
    concurrency:
      group: terraform-apply-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENV: ${{ inputs.environment }}

    steps:
      # Non-dev envs can only be applied from main
      - name: Guard branch
        run: |
          if [ "${ENV}" != "dev" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::${ENV} can only be applied from main (running on ${GITHUB_REF})"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure private module access
        env:
          TF_MODULES_TOKEN: ${{ secrets.TF_MODULES_TOKEN }}
        run: |
          if [ -n "$TF_MODULES_TOKEN" ]; then
            git config --global url."https://x-access-token:${TF_MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-tf-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          retry-max-attempts: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.17.0"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend/${ENV}.hcl

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -var-file=env/${ENV}.tfvars -out=tfplan

      - name: Publish plan to run summary
        run: |
          {
            echo '### Terraform apply (`'"${ENV}"'`)'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        run: terraform apply -input=false tfplan